[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "borderbench"
version = "1.2.0"
description = "Visual border, corner radius, stroke style, and elevation identification benchmark for multimodal models"
authors = [{ name = "Edward Benson" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "google-genai>=2.0",
    "openai>=1.0",
    "anthropic>=0.30",
    "httpx>=0.27",
    "pillow>=10.0",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["baseline*"]

[tool.setuptools.package-data]
baseline = ["prompt.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
